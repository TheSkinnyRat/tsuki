# PostgreSQL for local development, on 127.0.0.1:5432 (user/pass/db: tsuki).
#   docker compose -f deploy/compose.dev.yml up -d
# Port taken by another Postgres? TSUKI_PG_PORT=5433 docker compose ... and
# point DATABASE_URL at that port.
name: tsuki-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tsuki
      POSTGRES_PASSWORD: tsuki
      POSTGRES_DB: tsuki
    ports:
      - "127.0.0.1:${TSUKI_PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
